<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Plantilla Dinámica - OCC</title>
  <!-- Tailwind CSS CDN para estilos visuales modernos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 bg-slate-200">

  <!-- Contenedor Principal de Ancho Fijo (980px) Centrado -->
  <div class="w-[980px] h-[580px] bg-white rounded-xl shadow-2xl border border-slate-300 flex overflow-hidden p-3 gap-3">
    
    <!-- COLUMNA IZQUIERDA: FORMULARIO -->
    <div class="w-[520px] flex flex-col justify-between h-full pr-1 overflow-hidden">
      
      <!-- Campo 1: SN de la llamada -->
      <div class="bg-slate-50 p-2 rounded border border-slate-200">
        <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wide">SN de la llamada</label>
        <input type="text" id="snLlamada" oninput="generarResumen()" class="w-full mt-1 px-2 py-1 text-xs border border-slate-300 rounded focus:ring-1 focus:ring-red-500 focus:border-red-500 outline-none" placeholder="Ingrese número / identificador">
      </div>

      <!-- SECCIÓN OCC -->
      <div class="border border-slate-200 rounded overflow-hidden">
        <div class="bg-red-700 text-white font-bold text-[11px] px-2 py-0.5 tracking-wider uppercase text-center">
          OCC
        </div>
        <div class="p-2 space-y-1.5 bg-white text-[11px]">
          <div class="flex items-center justify-between">
            <span class="font-semibold text-slate-700">Aplica OCC:</span>
            <div class="flex items-center gap-4">
              <label class="inline-flex items-center gap-1 cursor-pointer">
                <input type="radio" name="aplicaOcc" value="Si" onchange="toggleOcc(true)" class="accent-red-600">
                <span>Sí</span>
              </label>
              <label class="inline-flex items-center gap-1 cursor-pointer">
                <input type="radio" name="aplicaOcc" value="No" checked onchange="toggleOcc(false)" class="accent-red-600">
                <span>No</span>
              </label>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 pt-1">
            <div>
              <label class="block text-slate-600 font-medium text-[10px]">Tipo de Solicitud</label>
              <select id="tipoSolicitud" disabled onchange="generarResumen()" class="w-full mt-0.5 px-1.5 py-1 border border-slate-300 rounded text-[11px] bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed">
                <option value="No aplica">No aplica</option>
                <option value="Baja voluntaria">Baja voluntaria</option>
                <option value="Migración a prepago">Migración a prepago</option>
                <option value="Contención competencia">Contención competencia</option>
                <option value="Contención falla servicio">Contención falla servicio</option>
              </select>
            </div>

            <div>
              <label class="block text-slate-600 font-medium text-[10px]">Operador</label>
              <select id="operador" disabled onchange="generarResumen()" class="w-full mt-0.5 px-1.5 py-1 border border-slate-300 rounded text-[11px] bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed">
                <option value="No aplica">No aplica</option>
                <option value="Bitel">Bitel</option>
                <option value="Entel">Entel</option>
                <option value="Movistar">Movistar</option>
              </select>
            </div>

            <div>
              <label class="block text-slate-600 font-medium text-[10px]">Mes Inicio</label>
              <select id="mesInicio" disabled onchange="generarResumen()" class="w-full mt-0.5 px-1.5 py-1 border border-slate-300 rounded text-[11px] bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed">
                <option value="No aplica">No aplica</option>
                <option value="Enero">Enero</option>
                <option value="Febrero">Febrero</option>
                <option value="Marzo">Marzo</option>
                <option value="Abril">Abril</option>
                <option value="Mayo">Mayo</option>
                <option value="Junio">Junio</option>
                <option value="Julio">Julio</option>
                <option value="Agosto">Agosto</option>
                <option value="Septiembre">Septiembre</option>
                <option value="Octubre">Octubre</option>
                <option value="Noviembre">Noviembre</option>
                <option value="Diciembre">Diciembre</option>
              </select>
            </div>

            <div>
              <label class="block text-slate-600 font-medium text-[10px]">Promoción Ofrecida</label>
              <select id="promocion" disabled onchange="generarResumen()" class="w-full mt-0.5 px-1.5 py-1 border border-slate-300 rounded text-[11px] bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed">
                <option value="No aplica">No aplica</option>
                <option value="25%">25%</option>
                <option value="30%">30%</option>
                <option value="50%">50%</option>
                <option value="60 Soles">60 Soles</option>
              </select>
            </div>

            <div class="col-span-2">
              <label class="block text-slate-600 font-medium text-[10px]">Cantidad de Meses</label>
              <select id="cantidadMeses" disabled onchange="generarResumen()" class="w-full mt-0.5 px-1.5 py-1 border border-slate-300 rounded text-[11px] bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed">
                <option value="No aplica">No aplica</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- SECCIÓN MIGRACIÓN DE PLAN -->
      <div class="border border-slate-200 rounded overflow-hidden">
        <div class="bg-red-700 text-white font-bold text-[11px] px-2 py-0.5 tracking-wider uppercase text-center">
          MIGRACIÓN DE PLAN
        </div>
        <div class="p-2 bg-white">
          <label class="block text-[11px] font-semibold text-slate-700">Cód. Interacción - Migración de plan</label>
          <input type="text" id="codInteraccion" oninput="validarSoloNumeros(this); generarResumen()" class="w-full mt-0.5 px-2 py-1 text-xs border border-slate-300 rounded outline-none" placeholder="Solo se permiten números *">
        </div>
      </div>

      <!-- SECCIÓN BONOS -->
      <div class="border border-slate-200 rounded overflow-hidden">
        <div class="bg-red-700 text-white font-bold text-[11px] px-2 py-0.5 tracking-wider uppercase text-center">
          BONOS
        </div>
        <div class="p-2 space-y-1.5 bg-white text-[11px]">
          <div class="flex items-center justify-between">
            <span class="font-semibold text-slate-700">Aplica Bono:</span>
            <div class="flex items-center gap-4">
              <label class="inline-flex items-center gap-1 cursor-pointer">
                <input type="radio" name="aplicaBono" value="Si" onchange="toggleBono(true)" class="accent-red-600">
                <span>Sí</span>
              </label>
              <label class="inline-flex items-center gap-1 cursor-pointer">
                <input type="radio" name="aplicaBono" value="No" checked onchange="toggleBono(false)" class="accent-red-600">
                <span>No</span>
              </label>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 pt-1">
            <div>
              <label class="block text-slate-600 font-medium text-[10px]">Bono a Activar (en GB) según CTR</label>
              <input type="text" id="bonoActivar" disabled oninput="validarSoloNumeros(this); generarResumen()" class="w-full mt-0.5 px-1.5 py-1 border border-slate-300 rounded text-[11px] bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed outline-none" placeholder="Solo números *">
            </div>

            <div>
              <label class="block text-slate-600 font-medium text-[10px]">Cantidad de Meses Bono</label>
              <select id="cantidadMesesBono" disabled onchange="generarResumen()" class="w-full mt-0.5 px-1.5 py-1 border border-slate-300 rounded text-[11px] bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed">
                <option value="No aplica">No aplica</option>
                <option value="1">1</option>
                <option value="3">3</option>
                <option value="6">6</option>
                <option value="12">12</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- CAMPOS ADICIONALES ABAJO -->
      <div class="grid grid-cols-2 gap-2 bg-slate-50 p-2 rounded border border-slate-200 text-[10px]">
        <div>
          <label class="block font-semibold text-slate-700">Caso inicial (No Procedente)</label>
          <input type="text" id="casoInicial" oninput="validarSoloNumeros(this); generarResumen()" class="w-full mt-0.5 px-1.5 py-0.5 text-xs border border-slate-300 rounded outline-none" placeholder="Solo números *">
        </div>
        <div>
          <label class="block font-semibold text-slate-700">Id Interacción de OCCs a anular</label>
          <input type="text" id="idOccsAnular" oninput="generarResumen()" class="w-full mt-0.5 px-1.5 py-0.5 text-xs border border-slate-300 rounded outline-none" placeholder="separado por ,">
        </div>
      </div>

    </div>

    <!-- COLUMNA DERECHA: RESUMEN Y BOTONES -->
    <div class="w-[430px] flex flex-col justify-between h-full bg-slate-50 border border-slate-300 rounded-lg p-3">
      
      <div class="flex flex-col h-[calc(100%-48px)]">
        <div class="flex items-center justify-between mb-1.5">
          <h2 class="text-xs font-bold text-slate-800 uppercase tracking-wide">Resumen generado:</h2>
          <span class="text-[10px] text-slate-500 font-medium">Actualización automática</span>
        </div>
        <textarea id="resultado" readonly class="w-full flex-grow p-3 bg-slate-900 text-emerald-400 font-mono text-[11px] leading-relaxed rounded border border-slate-800 resize-none outline-none shadow-inner select-all"></textarea>
      </div>

      <!-- BOTONES DE ACCIÓN -->
      <div class="grid grid-cols-3 gap-2 mt-2">
        <button onclick="generarResumen()" class="bg-red-700 hover:bg-red-800 text-white font-bold py-2 px-1 rounded text-[11px] transition duration-150 shadow-sm active:scale-95">
          Generar
        </button>
        <button onclick="copiarTexto()" class="bg-red-700 hover:bg-red-800 text-white font-bold py-2 px-1 rounded text-[11px] transition duration-150 shadow-sm active:scale-95">
          Copiar
        </button>
        <button onclick="limpiarFormulario()" class="bg-red-700 hover:bg-red-800 text-white font-bold py-2 px-1 rounded text-[11px] transition duration-150 shadow-sm active:scale-95">
          Limpiar
        </button>
      </div>

    </div>
  </div>

  <!-- Notificación flotante (Toast) -->
  <div id="toast" class="fixed bottom-4 right-4 bg-slate-900 text-white text-xs py-2 px-4 rounded-lg shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 border border-slate-700">
    ¡Copiado al portapapeles!
  </div>

  <script>
    // Inicialización del select de meses (1 a 12)
    const selectMeses = document.getElementById('cantidadMeses');
    for (let i = 1; i <= 12; i++) {
      const opt = document.createElement('option');
      opt.value = i.toString();
      opt.textContent = i.toString();
      selectMeses.appendChild(opt);
    }

    // Permitir solo números en campos específicos
    function validarSoloNumeros(input) {
      input.value = input.value.replace(/[^0-9]/g, '');
    }

    // Habilitar / Deshabilitar OCC
    function toggleOcc(habilitar) {
      const elementos = ['tipoSolicitud', 'operador', 'mesInicio', 'promocion', 'cantidadMeses'];
      elementos.forEach(id => {
        const el = document.getElementById(id);
        el.disabled = !habilitar;
        if (habilitar) {
          el.classList.remove('bg-slate-100');
          el.classList.add('bg-white');
        } else {
          el.classList.add('bg-slate-100');
          el.classList.remove('bg-white');
          el.value = "No aplica";
        }
      });
      generarResumen();
    }

    // Habilitar / Deshabilitar Bono
    function toggleBono(habilitar) {
      const elementos = ['bonoActivar', 'cantidadMesesBono'];
      elementos.forEach(id => {
        const el = document.getElementById(id);
        el.disabled = !habilitar;
        if (habilitar) {
          el.classList.remove('bg-slate-100');
          el.classList.add('bg-white');
        } else {
          el.classList.add('bg-slate-100');
          el.classList.remove('bg-white');
          if (el.tagName === 'SELECT') {
            el.value = "No aplica";
          } else {
            el.value = "";
          }
        }
      });
      generarResumen();
    }

    // Obtener valor formateado con "-" por defecto
    function getVal(id) {
      const el = document.getElementById(id);
      if (!el || el.disabled) return '-';
      const val = el.value.trim();
      return (val === '' || val === 'No aplica') ? '-' : val;
    }

    // Lógica para construir la plantilla en el cuadro de resumen
    function generarResumen() {
      const sn = document.getElementById('snLlamada').value.trim() || '-';
      
      const aplicaOccRadio = document.querySelector('input[name="aplicaOcc"]:checked');
      const aplicaOccVal = aplicaOccRadio && aplicaOccRadio.value === 'Si' ? 'Sí' : '-';

      const tipoSolicitud = getVal('tipoSolicitud');
      const operador = getVal('operador');
      const mesInicio = getVal('mesInicio');
      const promocion = getVal('promocion');
      const cantidadMeses = getVal('cantidadMeses');

      const codInteraccion = document.getElementById('codInteraccion').value.trim() || '-';

      const aplicaBonoRadio = document.querySelector('input[name="aplicaBono"]:checked');
      const aplicaBonoVal = aplicaBonoRadio && aplicaBonoRadio.value === 'Si' ? 'Sí' : '-';

      const bonoActivar = getVal('bonoActivar');
      const cantidadMesesBono = getVal('cantidadMesesBono');

      const casoInicial = document.getElementById('casoInicial').value.trim() || '-';
      const idOccsAnular = document.getElementById('idOccsAnular').value.trim() || '-';

      const plantilla = 
`RESUMEN - PLANTILLA DINÁMICA OCC
===================================

SN de la llamada: ${sn}
Aplica Occ: ${aplicaOccVal}
Tipo de Solicitud: ${tipoSolicitud}
Operador: ${operador}
Mes Inicio: ${mesInicio}
Promoción Ofrecida: ${promocion}
Cantidad de Meses: ${cantidadMeses}
Cód. Interacción - Migración de plan: ${codInteraccion}
Aplica Bono: ${aplicaBonoVal}
Bono a Activar (en GB) según CTR: ${bonoActivar}
Cantidad de Meses Bono: ${cantidadMesesBono}
Caso inicial
(solo para los casos No Procedente): ${casoInicial}
Id Interacción de OCCs a anular
(separado por , ): ${idOccsAnular}`;

      document.getElementById('resultado').value = plantilla;
    }

    // Copiar texto generado al portapapeles
    function copiarTexto() {
      const textarea = document.getElementById('resultado');
      textarea.select();
      navigator.clipboard.writeText(textarea.value).then(() => {
        mostrarToast();
      }).catch(err => {
        document.execCommand('copy');
        mostrarToast();
      });
    }

    function mostrarToast() {
      const toast = document.getElementById('toast');
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }

    // Limpiar formulario y vaciar completamente la caja de resumen
    function limpiarFormulario() {
      document.getElementById('snLlamada').value = '';
      
      document.querySelectorAll('input[name="aplicaOcc"]')[1].checked = true;
      toggleOcc(false);

      document.getElementById('codInteraccion').value = '';

      document.querySelectorAll('input[name="aplicaBono"]')[1].checked = true;
      toggleBono(false);

      document.getElementById('casoInicial').value = '';
      document.getElementById('idOccsAnular').value = '';

      // Dejar vacía la caja de texto del resumen
      document.getElementById('resultado').value = '';
    }

    // Generar resumen inicial al cargar la página
    generarResumen();
  </script>
</body>
</html>
